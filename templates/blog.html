{% extends 'base.html' %}


{% block contant %}
<div class=" p-3  flex flex-col flex-wrap gap-3 lg:px-10">
    <h1 class="text-2xl font-bold text-primery ">{{blog.title}}</h1>
    <p class="text-muted"> By {{blog.auther}} at {{ blog.clreated_at.strftime("%Y-%m-%d")}}</p> 
    <p>{{ blog.contant}}</p>
    {% if 'user' in session and session['user'] == blog.auther %}
    <div class="p-3">
    <a href="/blog/update/{{blog.blogId}}" class="bg-primery text-white rounded py-2 px-4 ">Update</a>
    <a href="/blog/delete/{{blog.blogId}}" class="bg-red-500 text-white rounded py-2 px-4 ">Delete</a>
    </div>
    {% endif %}
</div>

{% endblock %}
