<div class=" fixed w-[100dvw] h-[65px] flex items-center justify-between px-2 lg:px-5 py-2 shadow-lg ">

    <div class="logo">
        <h1 class="text-xl text-primery font-bold">Your Blog</h1>
    </div>
        <ul class=" flex lg:gap-10 ">
            <li class="hover:text-primery"><a href="/">Home</a></li>
            <li class="hover:text-primery"><a href="">Category</a></li>
            <li class="hover:text-primery"><a href="/blog/MyBlog">My Blog</a></li>
            <li class="hover:text-primery"><a href="">Contact</a></li>
        </ul>
        {% if not 'user' in session %}
        <div class=" flex md:gap-5 gap-2">
        <a class=" border rounded-lg bg-primery text-center text-white py-2 px-5 hover:bg-blue-500 " href="/login">Login</a>
        <a class=" border rounded-lg bg-primery text-center text-white py-2 px-5 hover:bg-blue-500 " href="/register">Register</a>
        </div>
        {% else %}
        <div class=" flex items-center md:gap-5 gap-2">
        <h3 class="text-xl font-bold text-primery">{{session.user}}</h3>
        <a class=" border rounded-lg bg-primery text-center text-white py-2 px-5 hover:bg-blue-500 " href="/logout">Logout</a>
        </div>
        {% endif %}
        

</div>
