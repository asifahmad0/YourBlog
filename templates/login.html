{% extends 'base.html' %}


{% block contant %}

<div class=" w-screen h-screen flex flex-col items-center justify-center py-2 mt-[60px]">
    <form method="post" class="w-[300px] h-[400px] flex flex-col justify-around border p-3">
        <h1 class="text-2xl text-primery font-bold text-center">Sign In</h1>

        <div class=" flex flex-col gap-2">
        <label for="uname">User Name</label>
        <input class="border outline-none p-2" type="text" id="uname" name="uname" placeholder="User Name">
        </div>
        
        <div class=" flex flex-col gap-2">
        <label for="upass">Password</label>
        <input class="border outline-none p-2" type="password" id="upass" name="upass" placeholder="User Password">
        </div>

        <button type="submit" class="p-2 bg-primery rounded-lg text-white cursor-pointer text-center" >Submit</button>
    </form> 



</div>

{% endblock %}
