{% extends 'base.html' %}


{% block contant %}

<div class="w-screen grid lg:grid-cols-4 grid-cols-1 mt-[60px] ">
 {% if all_blog %}
    {% for blog in all_blog %}
    <div class=" min-w-[300px] max-w-[300px] min-h-[400px] max-h-[400px] overflow-hidden flex flex-col gap-2
     items-center justify-between border p-2 lg:m-5 my-5 hover:scale-102 border-primery rounded-md">

      <!-- <div class=" ">
        <img src="" alt="">
      </div> -->

      <div class=" text-center flex flex-col gap-2 px-1 ">
        <h1 class="text-lg font-bold text-primery overflow-hidden">{{blog.title}}</h1>
        <p class="text-gray-500 overflow-hidden">By {{blog.auther}} at {{ blog.clreated_at.strftime("%Y-%m-%d")}}</p>

        <div class=" text-justify overflow-hidden">
          {{blog.contant}}
        </div>
        <a class="px-5 py-2 bg-blue-500 text-white text-lg overflow-hidden" href="/blog/{{blog.blogId}}">Read</a>
      </div>
    </div>
    {% endfor %}
    
    {% endif %}
    
  
    </div>

{% endblock %}
